<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Страница не найдена — Светлый Дом</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2E5B46">
<style>
  :root { --pine: #2E5B46; --pine-deep: #224736; --bg: #F7F4EF; --ink: #1D1C18; --muted: #57534A; --gold: #C89B5A; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 32px 20px;
    text-align: center;
    background: var(--bg);
    color: var(--ink);
    font-family: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .mark {
    width: 72px; height: 72px;
    border-radius: 20px;
    background: var(--pine);
    display: grid; place-items: center;
    box-shadow: 0 12px 32px rgba(29, 28, 24, .12);
  }
  .mark svg { width: 40px; height: 40px; }
  .brand {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 600;
    font-size: 26px;
    color: var(--pine);
    letter-spacing: .01em;
  }
  h1 {
    margin: 0;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 600;
    font-size: clamp(34px, 6vw, 54px);
    line-height: 1.1;
  }
  p { margin: 0; max-width: 46ch; color: var(--muted); font-size: 16px; line-height: 1.6; }
  .btns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 48px; padding: 0 24px;
    border-radius: 999px;
    font-weight: 700; font-size: 15px;
    text-decoration: none;
    transition: transform .15s, background .15s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-primary { background: var(--pine); color: #fff; }
  .btn-primary:hover { background: var(--pine-deep); }
  .btn-ghost { background: transparent; color: var(--pine); border: 1px solid rgba(46, 91, 70, .35); }
  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .contact { font-size: 14px; color: var(--muted); }
  .contact a { color: var(--pine); font-weight: 700; text-decoration: none; }
  .contact a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <span class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#F7F4EF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/>
    </svg>
  </span>
  <span class="brand">Светлый Дом</span>
  <h1>Такой страницы нет</h1>
  <p>Возможно, ссылка устарела или в адресе опечатка. Вернитесь на главную — там каталог апартаментов, цены и онлайн-бронирование.</p>
  <div class="btns">
    <a class="btn btn-primary" href="/" data-root>На главную</a>
    <a class="btn btn-ghost" href="/#apartments" data-root>Смотреть апартаменты</a>
  </div>
  <p class="contact">Или свяжитесь напрямую: <a href="tel:+79013490792">+7 901 349-07-92</a> · <a href="https://t.me/+79013490792">Telegram</a> · <a href="https://wa.me/79013490792">WhatsApp</a></p>
  <script>
    // GitHub Pages отдаёт 404.html из корня сайта, но URL остаётся вложенным.
    // Подставляем правильный корень: /svetliidom/ для демо на GitHub Pages.
    (function () {
      var seg = location.pathname.split('/')[1] || '';
      var base = seg && !seg.includes('.') ? '/' + seg + '/' : '/';
      document.querySelectorAll('[data-root]').forEach(function (a) {
        var hash = a.getAttribute('href').indexOf('#') > -1 ? '#apartments' : '';
        a.setAttribute('href', base + hash);
      });
    })();
  </script>
</body>
</html>
